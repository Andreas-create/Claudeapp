<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Peru Pack · Brainbow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%B5%F0%9F%87%AA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css?v=21" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Brainbow" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <section id="select">
      <div class="game-head">
        <h1>🇵🇪 Peru Affinity</h1>
        <p id="progress-line"></p>
        <p class="pack-blurb">Ten hard puzzles on Peruvian history, food, geography, arts and nature. Watch for words that fit more than one group.</p>
      </div>
      <div class="lv-grid pack" id="grid"></div>
    </section>

    <section id="play" hidden>
      <div class="play-head" id="playnav"></div>
      <p class="cn-hint" id="hint"></p>
      <div class="msg" id="msg"></div>
      <div class="cn-solved" id="solved"></div>
      <div class="cn-grid" id="cgrid"></div>
      <div class="cn-dots" id="dots"></div>
      <div class="hint-panel" id="hint-panel" hidden>
        <div class="hint-word" id="hint-word"></div>
        <div class="hint-text" id="hint-text"></div>
      </div>
      <div class="btn-row" id="controls">
        <button class="btn" id="hint-btn">💡 Hint <span id="hint-count">2</span></button>
        <button class="btn" id="shuffle-btn">Shuffle</button>
        <button class="btn" id="deselect-btn">Deselect</button>
        <button class="btn primary" id="submit-btn" disabled>Submit</button>
      </div>
    </section>
  </main>

  <script src="js/common.js?v=21"></script>
  <script src="js/cn-engine.js?v=21"></script>
  <script src="data/peru.js?v=21"></script>
  <script src="data/definitions.js?v=21"></script>
  <script src="js/peru.js?v=21"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
