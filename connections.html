<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Connections · Daily Puzzles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="game-head">
      <h1>Connections</h1>
      <p id="subhead">Create four groups of four</p>
    </div>
    <div class="msg" id="msg"></div>

    <div class="cn-solved" id="solved"></div>
    <div class="cn-grid" id="grid"></div>

    <div class="cn-dots" id="dots"></div>

    <div class="btn-row" id="controls">
      <button class="btn" id="shuffle-btn">Shuffle</button>
      <button class="btn" id="deselect-btn">Deselect</button>
      <button class="btn primary" id="submit-btn" disabled>Submit</button>
    </div>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <h2 id="stats-title">Connections</h2>
      <p class="result-line" id="result-line"></p>
      <div class="stats-row" id="stats-row"></div>
      <div class="btn-row">
        <button class="btn primary" id="share-btn">Share</button>
        <button class="btn" id="close-btn">Close</button>
      </div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="data/connections.js"></script>
  <script src="js/connections.js"></script>
</body>
</html>
