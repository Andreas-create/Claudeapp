<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Crunch · Brainbow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/main.css?v=23" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Brainbow" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="nav"></div>
  <main>
    <section id="select">
      <div class="game-head">
        <h1>🔢 Crunch</h1>
        <p id="progress-line"></p>
      </div>
      <div class="lv-grid" id="grid"></div>
    </section>

    <section id="play" hidden>
      <div class="play-head" id="playnav"></div>
      <div class="dg-target">
        <div class="label">Target</div>
        <div class="num" id="target">—</div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="dg-tiles" id="tiles"></div>
      <div class="dg-ops" id="ops"></div>
      <div class="btn-row" id="controls">
        <button class="btn" id="undo-btn">Undo</button>
        <button class="btn" id="reset-btn">Reset</button>
      </div>
    </section>
  </main>

  <script src="js/common.js?v=23"></script>
  <script src="js/digits.js?v=23"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
