<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('');
  html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{width:1024px;height:500px;background:#0f1115;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .wrap::before{content:"";position:absolute;inset:0;
    background:radial-gradient(900px 380px at 50% -10%,rgba(110,140,255,.20),transparent 70%);}
  .bar{position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(90deg,#ef5350,#ff9800,#ffd54f,#4caf7d,#42a5f5,#7e57c2);}
  .bar.b{top:auto;bottom:0;}
  h1{position:relative;font-size:104px;margin:0;letter-spacing:-.045em;font-weight:800;
    background:linear-gradient(100deg,#ef5350,#ff9800,#ffd54f,#4caf7d,#42a5f5,#7e57c2);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  p{position:relative;color:#c3c9d4;font-size:27px;margin:16px 0 0;font-weight:600;letter-spacing:-.01em;}
  .games{position:relative;display:flex;gap:15px;margin-top:34px;}
  .g{background:#1b1f28;border:1px solid #2c313d;border-radius:14px;
     padding:13px 25px;color:#e8eaed;font-size:22px;font-weight:700;display:flex;gap:10px;align-items:center;}
</style></head><body>
  <div class="wrap">
    <div class="bar"></div><div class="bar b"></div>
    <h1>Brainbow</h1>
    <p>Word, logic and number puzzles — 600+ levels, all offline</p>
    <div class="games">
      <div class="g">🔤 Word Guess</div>
      <div class="g">🔗 Affinity</div>
      <div class="g">🔢 Crunch</div>
    </div>
  </div>
</body></html>
